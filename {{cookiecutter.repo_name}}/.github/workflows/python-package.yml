# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
    tags: '*'
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ${{"{{"}} matrix.os {{"}}"}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{"{{"}} matrix.python-version {{"}}"}}
      uses: actions/setup-python@v6
      with:
        python-version: ${{"{{"}} matrix.python-version {{"}}"}}
        allow-prereleases: true
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Build Distribution
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build
    - name: Check Distribution
      run: |
        python -m pip install twine
        python -m twine check --strict dist/*
    - name: Install Test Dependencies
      run: |
        python -m pip install mypy pytest
        pip install -r test-requirements.txt
    - name: Run Type Checking
      run: |
        mypy
    - name: Install Package
      shell: bash
      # install what was built, so the tests run with the dependencies this plug-in declares and not only the ones Nion
      # Swift happens to require. this runs after type checking so mypy sees the source and not a second installed copy.
      run: |
        python -m pip install dist/*.whl
    - name: Run Tests
      run: |
        python -m pytest
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      with:
        name: distribution
        path: dist

  pypi-publish:
    name: Upload release to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    environment: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
    - name: Copy files to upload to PyPI to dist.
      shell: bash
      run: |
        mkdir dist
        find . -name "*.whl" -exec cp {} dist \;
        find . -name "*.tar.gz" -exec cp {} dist \;
        ls -lR .
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        print-hash: true
