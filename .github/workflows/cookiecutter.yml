# This workflow generates a package from the template and runs the checks the generated package configures, so a change
# to the template which would break a new plug-in is caught here rather than by the person generating it.

name: Cookiecutter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Generate Package
      run: |
        python -m pip install --upgrade pip
        python -m pip install cookiecutter
        cookiecutter --no-input --output-dir generated . repo_name=generated-plug-in
        ls -lR generated
    - name: Build Distribution
      working-directory: generated/generated-plug-in
      run: |
        python -m pip install build
        python -m build
    - name: Check Distribution
      working-directory: generated/generated-plug-in
      run: |
        python -m pip install twine
        python -m twine check --strict dist/*
    - name: Install Test Dependencies
      working-directory: generated/generated-plug-in
      run: |
        python -m pip install mypy pytest
        pip install -r test-requirements.txt
    - name: Run Type Checking
      working-directory: generated/generated-plug-in
      run: |
        mypy
    - name: Run Tests
      working-directory: generated/generated-plug-in
      run: |
        python -m pytest
